x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: cellguard-backend:local

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "3005"
  AUTH_MODE: demo
  DATA_MODE: postgres
  DATABASE_URL: postgresql://${POSTGRES_USER:-cellguard}:${POSTGRES_PASSWORD:-replace-with-a-local-password}@timescaledb:5432/${POSTGRES_DB:-cellguard}
  DATABASE_SSL: "false"
  KAFKA_ENABLED: "true"
  KAFKA_CONSUMER_ENABLED: "true"
  KAFKA_BROKERS: kafka:29092
  KAFKA_CLIENT_ID: cellguard-backend
  KAFKA_GROUP_ID: cellguard-backend
  KAFKA_ANOMALY_GROUP_ID: cellguard-backend-anomaly
  KAFKA_RAW_METRICS_TOPIC: battery-raw-metrics
  KAFKA_ANOMALY_ALERTS_TOPIC: battery-anomaly-alerts
  KAFKA_EVENTS_TOPIC: battery-events
  KAFKA_OUTBOX_BATCH_SIZE: "32"
  KAFKA_OUTBOX_LEASE_MS: "30000"
  KAFKA_OUTBOX_POLL_INTERVAL_MS: "1000"
  KAFKA_OUTBOX_RETRY_BASE_MS: "500"
  KAFKA_OUTBOX_RETRY_MAX_MS: "60000"
  CORS_ORIGINS: http://localhost:5173,http://localhost:3000
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3005}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-with-at-least-32-random-characters}
  DIAG_SURFACE_CUTOFF_C: "0"
  DIAG_TEMP_SLOPE_C_PER_MIN: "0"
  DIAG_GAS_RAW: "0"
  DIAG_S1_THERMAL_SLOPE_C_PER_MIN: "0"
  DIAG_ASSUMED_EFFICIENCY: "0.88"
  DIAG_TEMP_SLOPE_WINDOW_MS: "60000"
  DIAG_TEMP_SLOPE_MIN_SAMPLES: "5"

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cellguard}
      POSTGRES_USER: ${POSTGRES_USER:-cellguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc
          "select case when exists (select 1 from pg_available_extensions where name = 'timescaledb') then 1 else 0 end"
          | grep -q '^1$'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,LOCALHOST:PLAINTEXT,LAN:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,LOCALHOST://:9092,LAN://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,LOCALHOST://localhost:9092,LAN://${KAFKA_LAN_ADVERTISED_HOST:-cellguard-host.example.invalid}:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_LOCAL_PORT:-9092}:9092"
      - "${KAFKA_LAN_BIND_ADDRESS:-0.0.0.0}:${KAFKA_LAN_PORT:-19092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      for topic in battery-raw-metrics battery-anomaly-alerts battery-events; do
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic "$${topic}" \
          --partitions "$${KAFKA_TOPIC_PARTITIONS}" \
          --replication-factor 1
      done
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

  migrate:
    <<: *backend-build
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cellguard}:${POSTGRES_PASSWORD:-replace-with-a-local-password}@timescaledb:5432/${POSTGRES_DB:-cellguard}
      DATABASE_SSL: "false"
    command: ["npm", "run", "db:migrate"]

  backend:
    <<: *backend-build
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3005}:3005"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e
          "fetch('http://127.0.0.1:3005/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  ai:
    profiles: ["ai"]
    build:
      context: ./ai
      dockerfile: Dockerfile
    image: cellguard-ai:local
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      AI_ENV: production
      AI_MODEL_BUNDLE_DIR: /models/bundle
      AI_KAFKA_BROKERS: kafka:29092
      AI_KAFKA_CLIENT_ID: cellguard-ai-inference
      AI_KAFKA_GROUP_ID: cellguard-ai-inference
      AI_RAW_TOPIC: battery-raw-metrics
      AI_ANOMALY_TOPIC: battery-anomaly-alerts
      AI_POLL_TIMEOUT_MS: "1000"
      AI_PUBLISH_TIMEOUT_MS: "10000"
      PYTHONPATH: /app:/opt/cellguard/external
    volumes:
      - ${AI_MODEL_BUNDLE_HOST_PATH:-./ai/artifacts}:/models/bundle:ro
      - ${AI_ADAPTER_HOST_PATH:-./ai/external}:/opt/cellguard/external:ro
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  timescaledb-data:
  kafka-data:
